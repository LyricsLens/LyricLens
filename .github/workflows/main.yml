# github actions
name: "Terraform Automation"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
          - test

jobs:
  terraform_test:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - name: "print hello"
        run: echo "hello world"
