name: Terraform Automation

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]
  push:
    branches: [main]

jobs:
  plan_apply_on_push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (Optional but recommended) Use OIDC + role instead of static keys.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Terraform Init
        run: terraform init

      - name: Build static site
        run: |
          cd client
          npm ci
          npm run build

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Upload to S3 (use TF output)
        run: |
          BUCKET=$(terraform output -raw bucket_name) # create this output in TF
          aws s3 sync ./client/out "s3://${BUCKET}" --delete

  apply_manual:
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
      - run: terraform init
      - run: |
          cd client && npm ci && npm run build && cd ..
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan
      - run: |
          BUCKET=$(terraform output -raw bucket_name)
          aws s3 sync ./client/out "s3://${BUCKET}" --delete

  destroy_manual:
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
      - name: Remove all files from S3 Bucket
        run: |
          BUCKET=$(terraform output -raw bucket_name)
          aws s3 rm "s3://${BUCKET}" --recursive
      - run: terraform init
      - name: Terraform Destroy
        run: terraform destroy -auto-approve
