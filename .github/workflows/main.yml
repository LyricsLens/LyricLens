name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: What do you want to do?
        type: choice
        options: [plan, apply, destroy]
        default: plan

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true

jobs:
  tf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Zip Lambda function
        shell: bash
        run: |
          cd modules/lambdas

          # Clean start
          rm -rf package lambda_function.zip
          mkdir package

          # Install dependencies FIRST
          pip install --target ./package -r requirements.txt

          # Copy Python files TO package
          cp *.py package/
          cp *.json package/ 2>/dev/null || true

          # Zip FROM INSIDE package
          cd package
          zip -r ../lambda_function.zip .
          cd ..

          # Update Lambda
          aws lambda update-function-code \
            --function-name lyric-lens-handler \
            --zip-file fileb://lambda_function.zip \
            --region us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Detect caller account
        id: acct
        shell: bash
        run: |
          set -euo pipefail
          ACCT="$(aws sts get-caller-identity --query Account --output text)"
          echo "Caller account: $ACCT"
          echo "account=$ACCT" >> "$GITHUB_OUTPUT"
          echo "key=state/${ACCT}/swen514/prod/terraform.tfstate" >> "$GITHUB_OUTPUT"

      - name: Ensure caller S3 state bucket exists
        id: s3
        shell: bash
        env:
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          ACCT="${{ steps.acct.outputs.account }}"
          BUCKET="tf-state-${ACCT}-${REGION}"
          echo "Using bucket: $BUCKET"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration '{
              "BlockPublicAcls": true, "IgnorePublicAcls": true, "BlockPublicPolicy": true, "RestrictPublicBuckets": true
            }'
            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{
              "Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]
            }'
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Ensure caller DynamoDB lock table exists
        id: ddb
        shell: bash
        env:
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          TABLE="tf-locks"
          if ! aws dynamodb describe-table --table-name "$TABLE" --region "$REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$REGION"
          fi
          echo "table=$TABLE" >> "$GITHUB_OUTPUT"

      - name: Clean TF working dir
        shell: bash
        run: rm -rf .terraform .terraform.lock.hcl

      - name: Terraform Init (per-caller backend)
        shell: bash
        run: terraform init -reconfigure -backend-config="bucket=tf-state-${{ steps.acct.outputs.account }}-us-east-1" -backend-config="region=us-east-1" -backend-config="dynamodb_table=tf-locks" -backend-config="encrypt=true" -backend-config="key=${{ steps.acct.outputs.key }}"

      - name: Terraform Validate
        shell: bash
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        shell: bash
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        shell: bash
        env:
          GENIUS_TOKEN: ${{secrets.GENIUS_TOKEN}}
          SPOTIFY_CLIENT_ID: ${{secrets.SPOTIFY_CLIENT_ID}}
          SPOTIFY_CLIENT_SECRET: ${{secrets.SPOTIFY_CLIENT_SECRET}}
        run: terraform apply -auto-approve -input=false tfplan || terraform apply -auto-approve -input=false

      - name: Get API URL & Website Bucket
        if: ${{ github.event.inputs.action == 'apply' }}
        id: outputs
        run: |
          echo "api_url=$(terraform output -raw api_invoke_url)" >> "$GITHUB_OUTPUT"
          echo "bucket_name=$(terraform output -raw website_bucket_name)" >> "$GITHUB_OUTPUT"

      - name: "Build client application"
        if: ${{ github.event.inputs.action == 'apply' }}
        shell: bash
        run: |
          cd client
          echo "NEXT_PUBLIC_API_URL=${{ steps.outputs.outputs.api_url }}" > .env.production
          cat .env.production
          npm install
          npm run build

      - name: Get website bucket name
        if: ${{ github.event.inputs.action == 'apply' }}
        id: site
        shell: bash
        run: |
          BUCKET="$(terraform output -raw website_bucket_name 2>/dev/null || true)"
          if [ -z "$BUCKET" ]; then
            BUCKET="$(terraform output -raw bucket_name 2>/dev/null || true)"
          fi

          if [ -z "$BUCKET" ]; then
            echo "Bucket output not found. Ensure your module exports 'website_bucket_name' or 'bucket_name'." >&2
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "Will upload to: s3://$BUCKET"

      - name: Move built client to S3
        if: ${{ github.event.inputs.action == 'apply' }}
        shell: bash
        run: aws s3 sync --delete ./client/out "s3://${{ steps.site.outputs.bucket }}" --region ${{ env.AWS_REGION }}

      - name: Pre-destroy cleanup (empty S3 buckets created by TF)
        if: ${{ github.event.inputs.action == 'destroy' }}
        shell: bash
        env:
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          # If you output bucket names from TF, you can fetch them here.
          # Example (adjust to your outputs): BUCKET=$(terraform output -raw bucket_name || true)
          # If known/stable name, you can hardcode or skip this step.

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        shell: bash
        run: terraform destroy -auto-approve -input=false

      - name: "Website URL"
        if: ${{ github.event.inputs.action == 'apply' }}
        shell: bash
        run: |
          URL="$(terraform output -raw website_url)"
              echo "The application should be available at:"
              echo "$URL"
              {
                echo "## Deployment Successful! :)"
                echo ""
                echo "**Website URL:** [$URL]($URL)"
                echo ""
                echo "> Click the link above to view your deployed application."
              } >> "$GITHUB_STEP_SUMMARY"
